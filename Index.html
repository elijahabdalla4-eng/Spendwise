<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Interactive Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SpendWise</h1>
      <p>Track your spending, manage your budget, and stay in control.</p>
    </header>

    <!-- Budget Overview Cards -->
    <section class="dashboard">
      <div class="card">
        <h3>Total Spent</h3>
        <p id="total-spent">$0.00</p>
      </div>
      <div class="card">
        <h3>Monthly Budget</h3>
        <p id="budget-limit">$1,000.00</p>
      </div>
      <div class="card">
        <h3>Remaining Balance</h3>
        <p id="remaining-budget">$1,000.00</p>
      </div>
    </section>

    <!-- Budget Alert Banner -->
    <div id="status-message" class="alert info">
      Enter expenses below to start tracking your budget.
    </div>

    <!-- Expense Entry Form -->
    <section class="form-container">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" placeholder="e.g., Groceries" required>
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount ($)</label>
          <input type="number" id="expense-amount" placeholder="e.g., 45.50" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Transport">Transport</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Expense</button>
      </form>
    </section>

    <!-- Expense List Section -->
    <section class="list-container">
      <h2>Expense History</h2>
      <table class="expense-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expense-list">
          <!-- Dynamic rows added via JS -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
